name: Publish

# 发版：改 package.json 和 src-tauri/Cargo.toml 的 version，合入 main 后推送 tag `v<version>`。
# 手动运行（workflow_dispatch）时，tag 由 package.json 的版本推出，不再用分支名当 tag。
# 产物统一命名为 LIVE_<version>_<系统>-<架构>[-变体].<扩展名>，先进入草稿 release，核对后手动发布。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 关键：必须有 contents: write 才能创建 Release
permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version and tag
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::package.json ($version) 和 src-tauri/Cargo.toml ($cargo_version) 的版本不一致"
            exit 1
          fi
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $version 不一致，应为 $tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Create draft release
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$is_draft" != "true" ]; then
              echo "::error::$TAG 已正式发布，不会覆盖它的安装包；请先提升版本号"
              exit 1
            fi
            echo "Draft release $TAG already exists; its assets will be replaced."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --draft --target "$GITHUB_SHA" --title "LIVE $TAG" --generate-notes
          fi

  publish-unix:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS arm64 (Apple Silicon)
          - platform: macos-15
            args: "--target aarch64-apple-darwin --bundles app"
            rust-target: aarch64-apple-darwin
            label: macos-arm64
          # macOS x86_64 (Intel)
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin --bundles app"
            rust-target: x86_64-apple-darwin
            label: macos-x64
          # Linux x86_64
          - platform: ubuntu-22.04
            args: ""
            rust-target: ""
            label: linux-x64

    runs-on: ${{ matrix.platform }}
    name: Publish (${{ matrix.label }})
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      TAG: ${{ needs.prepare-release.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- Node.js ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yarn
        run: npm install -g yarn

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      # ---------- Rust ----------
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # 跨平台编译 macOS 需要额外的 target
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # ---------- Linux ----------
      - name: Install Linux system dependencies
        if: startsWith(matrix.label, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            pkg-config \
            cmake \
            clang \
            llvm

      - name: Build Linux packages
        if: startsWith(matrix.label, 'linux-')
        run: yarn tauri build

      # ---------- macOS ----------
      - name: Install macOS dependencies (cmake/llvm for whisper-rs)
        if: startsWith(matrix.label, 'macos-')
        run: |
          brew install cmake llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Build macOS app bundle
        if: startsWith(matrix.label, 'macos-')
        env:
          CMAKE_OSX_DEPLOYMENT_TARGET: "13.3"
          MACOSX_DEPLOYMENT_TARGET: "13.3"
          CMAKE_PROJECT_INCLUDE: ${{ github.workspace }}/scripts/macos-portable.cmake
          GGML_METAL_EMBED_LIBRARY: ${{ matrix.rust-target == 'aarch64-apple-darwin' && '1' || '' }}
          WHISPER_DONT_GENERATE_BINDINGS: "1"
        run: |
          LIBCLANG_PATH="$(brew --prefix llvm)/lib"
          export LIBCLANG_PATH
          read -r -a build_args <<< "${{ matrix.args }}"
          yarn tauri build "${build_args[@]}"

      - name: Package macOS DMG
        if: startsWith(matrix.label, 'macos-')
        run: bash ./scripts/package-macos-dmg.sh ${{ matrix.rust-target }}

      # ---------- 统一命名并上传 ----------
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          out=release-assets
          mkdir -p "$out"
          take() { # take <源文件> <目标文件名>
            [ -f "$1" ] || { echo "::error::找不到 $1"; exit 1; }
            cp "$1" "$out/$2"
          }
          case "${{ matrix.label }}" in
            macos-arm64)
              take "src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/LIVE_${VERSION}_aarch64.dmg" "LIVE_${VERSION}_macos-arm64.dmg" ;;
            macos-x64)
              take "src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/LIVE_${VERSION}_x86_64.dmg" "LIVE_${VERSION}_macos-x64.dmg" ;;
            linux-x64)
              bundle=src-tauri/target/release/bundle
              for pair in "appimage/*.AppImage:AppImage" "deb/*.deb:deb" "rpm/*.rpm:rpm"; do
                pattern="${pair%%:*}"; ext="${pair##*:}"
                files=($bundle/$pattern)
                [ "${#files[@]}" -eq 1 ] || { echo "::error::$bundle/$pattern 应恰好有 1 个文件，实际 ${#files[@]} 个"; exit 1; }
                cp "${files[0]}" "$out/LIVE_${VERSION}_linux-x64.$ext"
              done ;;
          esac
          ls -l "$out"

      - name: Upload assets to draft release
        shell: bash
        run: gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIVE_${{ env.VERSION }}_${{ matrix.label }}
          path: release-assets/*
          compression-level: 0
          if-no-files-found: error

  publish-windows:
    needs: prepare-release
    runs-on: windows-2022
    name: Publish (windows-x64)
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      TAG: ${{ needs.prepare-release.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install yarn
        run: npm install -g yarn

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Windows dependencies
        shell: bash
        run: |
          choco install cmake llvm -y --no-progress
          printf '%s\n' 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"
          printf '%s\n' 'C:\Program Files\CMake\bin' >> "$GITHUB_PATH"

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "12.8.0"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'

      - name: Prepare CUDA resources
        shell: powershell
        run: .\prepare-cuda-resources.ps1

      - name: Prepare FFmpeg resources
        shell: powershell
        run: .\ffmpeg_setup.ps1

      - name: Build Windows packages
        shell: powershell
        env:
          CUDA_PATH: ${{ env.CUDA_PATH }}
          REQUIRE_CUDA_BUILD: "1"
        run: .\build.ps1

      - name: Report package sizes
        shell: powershell
        run: |
          $files = @(
            Get-ChildItem src-tauri/target -Filter 'LIVE-*_x64-setup.exe'
            Get-ChildItem src-tauri -Filter '*.exe' -File
            Get-ChildItem src-tauri -Filter '*.dll' -File
          )
          $files |
            Sort-Object Length -Descending |
            ForEach-Object { '{0,9:N1} MiB  {1}' -f ($_.Length / 1MB), $_.Name }

      # build.ps1 产出 LIVE-cpu_<v>_x64-setup.exe / LIVE-cuda_<v>_x64-setup.exe，这里改成统一命名
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp "src-tauri/target/LIVE-cpu_${VERSION}_x64-setup.exe" "release-assets/LIVE_${VERSION}_windows-x64-setup.exe"
          cp "src-tauri/target/LIVE-cuda_${VERSION}_x64-setup.exe" "release-assets/LIVE_${VERSION}_windows-x64-cuda-setup.exe"
          ls -l release-assets

      - name: Upload assets to draft release
        shell: bash
        run: gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload CPU installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIVE_${{ env.VERSION }}_windows-x64
          path: release-assets/LIVE_${{ env.VERSION }}_windows-x64-setup.exe
          compression-level: 0
          if-no-files-found: error

      - name: Upload CUDA installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIVE_${{ env.VERSION }}_windows-x64-cuda
          path: release-assets/LIVE_${{ env.VERSION }}_windows-x64-cuda-setup.exe
          compression-level: 0
          if-no-files-found: error
